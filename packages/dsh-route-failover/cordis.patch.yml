# 挂载本插件。默认配置：连续 3 次 TRANSPORT 失败 -> 切到 vllm/qwen3.8-27b，
# 每 60 秒探测主路由，连续两次健康就自动切回。
#
# 覆盖示例（用户 profile 的 cordis.patch.yml 按 id 覆盖）：
#   - id: route-failover
#     config:
#       threshold: 3
#       fallback:
#         provider: vllm
#         model: qwen3.8-27b
#       probeIntervalMs: 60000
#       restore: true
- insert:
    - id: route-failover
      name: 'dsh-route-failover'
      config:
        threshold: 3
        fallback:
          provider: vllm
          model: qwen3.8-27b
        probeIntervalMs: 60000
        restore: true
